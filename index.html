<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYFALL — Sky Survival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f1e; --bg-deep:#070911;
    --panel:#161b34; --panel-alt:#1e2544;
    --border:#323a63; --border-dim:#232a4a;
    --text:#e8e2d2; --text-dim:#8890b2;
    --moss:#7a9a63; --ember:#c15b3a; --gold:#d3ab52; --sky:#5a86b8; --frost:#7fb0c9; --purple:#9d7fc9;
    --danger-glow: rgba(193,91,58,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, #1a2148 0%, var(--bg) 45%), var(--bg);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:24px 18px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border-dim);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  h1{font-family:'Spectral',serif;font-weight:700;font-size:1.7rem;letter-spacing:0.04em;margin:0;color:var(--text);}
  h1 span{color:var(--gold);}
  .subtitle{font-size:0.72rem;letter-spacing:0.14em;color:var(--text-dim);text-transform:uppercase;margin-top:2px;}
  .day-counter{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--text-dim);border:1px solid var(--border-dim);padding:6px 12px;border-radius:2px;background:var(--panel);text-align:right;}
  .day-counter b{color:var(--sky);}
  .day-counter .trial-note{display:block;font-size:0.68rem;color:var(--ember);margin-top:2px;}

  .grid{display:grid;grid-template-columns:270px 1fr;gap:18px;}
  @media (max-width:820px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--border-dim);border-radius:3px;padding:16px;}
  .panel + .panel{margin-top:14px;}
  .panel-title{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}

  .lvl-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .lvl-row .lvl{font-family:'Spectral',serif;font-size:1.4rem;font-weight:600;color:var(--gold);}
  .bar-track{background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:2px;height:7px;overflow:hidden;margin-bottom:10px;}
  .bar-fill{height:100%;transition:width .35s ease;}
  .bar-fill.xp{background:linear-gradient(90deg,#5a86b8,#7fa8d6);}
  .bar-fill.health{background:linear-gradient(90deg,#a13a3a,#d65d5d);}
  .bar-fill.hunger{background:linear-gradient(90deg,#7a9a63,#9bc27c);}
  .bar-fill.thirst{background:linear-gradient(90deg,#3a6a8a,#5fa0c9);}
  .bar-fill.stamina{background:linear-gradient(90deg,#8a7a3a,#d3ab52);}
  .bar-fill.temp{background:linear-gradient(90deg,#5a86b8,#c15b3a);}
  .bar-fill.weight{background:linear-gradient(90deg,#6e5a94,#9d7fc9);}
  .bar-fill.low{filter:brightness(0.7) saturate(1.4);}
  .bar-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--text-dim);margin-bottom:3px;}

  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .attr{background:var(--bg-deep);border:1px solid var(--border-dim);padding:7px 9px;border-radius:2px;display:flex;justify-content:space-between;align-items:center;}
  .attr-name{font-size:0.66rem;color:var(--text-dim);letter-spacing:0.03em;}
  .attr-val{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--text);font-size:0.85rem;}
  .attr-plus{width:18px;height:18px;border-radius:2px;border:1px solid var(--gold);color:var(--gold);background:transparent;font-size:0.75rem;cursor:pointer;line-height:1;display:none;}
  .attr-plus.show{display:inline-block;}
  .attr-plus:hover{background:var(--gold);color:var(--bg-deep);}
  .points-banner{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--gold);border:1px dashed var(--gold);padding:6px 8px;border-radius:2px;margin-top:10px;text-align:center;display:none;}
  .points-banner.show{display:block;}

  .res-list{display:flex;flex-direction:column;gap:5px;}
  .res-row{display:flex;justify-content:space-between;font-size:0.8rem;padding:3px 0;border-bottom:1px solid var(--border-dim);}
  .res-row:last-child{border-bottom:none;}
  .res-name{color:var(--text-dim);}
  .res-name.rare{color:var(--gold);}
  .res-name.super{color:var(--purple);}
  .res-name.special{color:var(--frost);}
  .res-val{font-family:'IBM Plex Mono',monospace;color:var(--text);}
  .empty-note{color:var(--text-dim);font-size:0.78rem;font-style:italic;}
  .equip-row{font-size:0.74rem;color:var(--frost);margin-top:8px;padding-top:8px;border-top:1px solid var(--border-dim);line-height:1.6;}
  .equip-row .gate{color:var(--ember);}

  .event-banner{background:rgba(157,127,201,0.12);border:1px solid var(--purple);border-radius:2px;padding:8px 12px;margin-bottom:12px;font-size:0.8rem;color:var(--purple);}
  .event-banner b{color:var(--text);}

  .main-panel{min-height:440px;display:flex;flex-direction:column;}
  .scene-title{font-family:'Spectral',serif;font-size:1.25rem;font-weight:600;margin:0 0 6px;}
  .scene-desc{color:var(--text-dim);font-size:0.85rem;line-height:1.5;margin-bottom:14px;max-width:65ch;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);margin:14px 0 8px;}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:16px;}
  .btn-row.static{margin-top:0;padding-top:0;}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:0.82rem;padding:9px 15px;border-radius:2px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);cursor:pointer;transition:all .15s ease;}
  .btn:hover{border-color:var(--sky);background:#232b52;}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.primary{background:var(--sky);border-color:var(--sky);color:#0c0f1e;}
  .btn.primary:hover{background:#6d97c8;}
  .btn.danger{border-color:var(--ember);color:var(--ember);background:transparent;}
  .btn.danger:hover{background:var(--danger-glow);}
  .btn.gold{border-color:var(--gold);color:var(--gold);background:transparent;}
  .btn.gold:hover{background:rgba(211,171,82,0.15);}
  .btn.moss{border-color:var(--moss);color:var(--moss);background:transparent;}
  .btn.moss:hover{background:rgba(122,154,99,0.15);}
  .btn.small{padding:6px 10px;font-size:0.72rem;}

  .island-box{display:flex;align-items:center;justify-content:center;padding:12px 10px 4px;}
  .island{position:relative;width:150px;height:150px;}
  .island svg{width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,0.5));}
  .land-meter{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--text-dim);text-align:center;margin-bottom:10px;}
  .land-meter b{color:var(--moss);}
  .struct-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .struct-chip{background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:2px;padding:6px 10px;font-size:0.76rem;display:flex;align-items:center;gap:8px;}
  .struct-chip b{color:var(--moss);}
  .struct-chip .tier-badge{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;background:rgba(211,171,82,0.2);color:var(--gold);padding:1px 5px;border-radius:2px;}

  .zone-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .zone-card{background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:3px;padding:12px 14px;}
  .zone-card .zn{font-family:'Spectral',serif;font-weight:600;font-size:1rem;margin-bottom:4px;}
  .zone-card .zd{font-size:0.78rem;color:var(--text-dim);line-height:1.5;margin-bottom:8px;}
  .zone-tag{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;padding:2px 6px;border-radius:2px;margin-right:6px;}
  .zone-tag.t1{background:rgba(122,154,99,0.2);color:var(--moss);}
  .zone-tag.t2{background:rgba(211,171,82,0.2);color:var(--gold);}
  .zone-tag.t3{background:rgba(157,127,201,0.2);color:var(--purple);}
  .zone-tag.event{background:rgba(157,127,201,0.3);color:var(--purple);}

  .exp-stats{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;}
  .exp-stat{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--text-dim);}
  .exp-stat b{color:var(--text);}
  .carried-box{background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:2px;padding:10px 12px;margin-bottom:6px;min-height:34px;}
  .carried-box .res-name{color:var(--moss);}
  .cap-note{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--text-dim);margin-top:6px;}

  .consume-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .consume-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:2px;padding:6px 10px;font-size:0.78rem;gap:10px;}
  .consume-row .cr-name{color:var(--text);}
  .consume-row .cr-meta{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:0.68rem;}

  .leg-track{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .leg-dot{width:22px;height:6px;border-radius:3px;background:var(--border-dim);}
  .leg-dot.done{background:var(--moss);}
  .leg-dot.current{background:var(--gold);}

  .beacon-box{background:var(--bg-deep);border:1px solid var(--gold);border-radius:3px;padding:16px;text-align:center;margin-bottom:16px;}
  .beacon-box .bicon{font-size:2rem;margin-bottom:8px;}

  .log-panel{margin-top:14px;}
  .log-entry{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:6px 0;border-bottom:1px solid var(--border-dim);color:var(--text-dim);line-height:1.4;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry.good{color:var(--moss);}
  .log-entry.bad{color:var(--ember);}
  .log-entry.rare{color:var(--gold);}
  .log-entry.super{color:var(--purple);}
  .log-entry .tag{color:var(--text-dim);opacity:0.6;margin-right:6px;}

  .sys-overlay{position:fixed;inset:0;background:rgba(5,7,15,0.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .sys-overlay.show{display:flex;}
  .sys-box{background:var(--panel);border:1px solid var(--gold);max-width:500px;width:100%;padding:26px 24px;border-radius:3px;position:relative;overflow:hidden;max-height:85vh;overflow-y:auto;}
  .sys-box::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(211,171,82,0.03) 0px,rgba(211,171,82,0.03) 1px,transparent 1px,transparent 3px);pointer-events:none;}
  .sys-box.danger{border-color:var(--ember);}
  .sys-tag{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.16em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
  .sys-box.danger .sys-tag{color:var(--ember);}
  .sys-title{font-family:'Spectral',serif;font-size:1.3rem;font-weight:600;margin:0 0 10px;}
  .sys-body{font-size:0.86rem;color:var(--text-dim);line-height:1.55;margin-bottom:20px;}
  .sys-body b{color:var(--text);}
  .sys-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .sys-btn{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.05em;background:var(--gold);color:#0c0f1e;border:none;padding:10px 18px;border-radius:2px;cursor:pointer;font-weight:600;}
  .sys-box.danger .sys-btn{background:var(--ember);}
  .sys-btn:hover{opacity:0.88;}
  .sys-btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text-dim);}

  .combat-vs{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .combatant{flex:1;min-width:180px;}
  .combatant-name{font-family:'Spectral',serif;font-weight:600;font-size:1rem;margin-bottom:6px;}
  .combatant.enemy .combatant-name{color:var(--ember);}
  .combat-log{background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:2px;padding:10px 12px;max-height:130px;overflow-y:auto;margin-bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:0.74rem;color:var(--text-dim);}
  .combat-log div{padding:2px 0;}

  .build-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .build-cat{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin:10px 0 2px;}
  .build-cat:first-child{margin-top:0;}
  .build-item{background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:2px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .build-item .bi-name{font-weight:600;font-size:0.85rem;}
  .build-item .bi-cost{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--text-dim);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>SKY<span>FALL</span></h1>
      <div class="subtitle" id="playerNameTag">Extraction Survival on a Floating Plot</div>
    </div>
    <div class="day-counter">DAY <b id="dayNum">1</b><span class="trial-note" id="trialNote"></span></div>
  </header>

  <div class="grid">
    <div>
      <div class="panel">
        <div class="panel-title">Operator</div>
        <div class="lvl-row"><span class="lvl" id="lvlVal">Lv. 1</span><span style="font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--text-dim);" id="xpText">0/80 XP</span></div>
        <div class="bar-track"><div class="bar-fill xp" id="xpBar" style="width:0%"></div></div>

        <div class="bar-label"><span>HEALTH</span><span id="healthText">100/100</span></div>
        <div class="bar-track"><div class="bar-fill health" id="healthBar" style="width:100%"></div></div>
        <div class="bar-label"><span>HUNGER</span><span id="hungerText">100/100</span></div>
        <div class="bar-track"><div class="bar-fill hunger" id="hungerBar" style="width:100%"></div></div>
        <div class="bar-label"><span>THIRST</span><span id="thirstText">100/100</span></div>
        <div class="bar-track"><div class="bar-fill thirst" id="thirstBar" style="width:100%"></div></div>
        <div class="bar-label"><span>STAMINA</span><span id="staminaText">100/100</span></div>
        <div class="bar-track"><div class="bar-fill stamina" id="staminaBar" style="width:100%"></div></div>
        <div class="bar-label"><span>TEMPERATURE</span><span id="tempText">Neutral</span></div>
        <div class="bar-track"><div class="bar-fill temp" id="tempBar" style="width:50%"></div></div>
        <div class="bar-label"><span>CARRY WEIGHT</span><span id="weightText">0/40</span></div>
        <div class="bar-track"><div class="bar-fill weight" id="weightBar" style="width:0%"></div></div>

        <div class="attrs" id="attrsBox"></div>
        <div class="points-banner" id="pointsBanner">points available</div>
        <div class="equip-row" id="equipRow"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Home Storage <span id="storageCount" style="color:var(--text-dim);font-weight:400;"></span></div>
        <div class="land-meter" style="text-align:left;margin-bottom:8px;" id="storageCapNote"></div>
        <div class="res-list" id="storageList"></div>
      </div>
    </div>

    <div>
      <div class="panel main-panel" id="mainPanel"></div>
      <div class="panel log-panel">
        <div class="panel-title">System Log</div>
        <div id="logList"></div>
      </div>
    </div>
  </div>
</div>

<div class="sys-overlay" id="sysOverlay">
  <div class="sys-box" id="sysBox">
    <div class="sys-tag" id="sysTag">// SYSTEM</div>
    <div class="sys-title" id="sysTitle">Notice</div>
    <div class="sys-body" id="sysBody">...</div>
    <div class="sys-actions" id="sysActions"></div>
  </div>
</div>

<div id="charCreateScreen" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;">
  <div class="panel" style="max-width:440px;width:100%;">
    <div class="panel-title">// SYSTEM — New Operator</div>
    <h2 class="scene-title" style="font-family:'Spectral',serif;">Welcome to Skyfall</h2>
    <div id="charCreateBody"></div>
  </div>
</div>

<script>
/* =========================================================
   SKYFALL v7
   Extraction beacon activation, level-gated equipment tiers,
   richer food chain, jackpot finds, world events.
   ========================================================= */

const RESOURCE_META = {
  wood:    {label:'Wood',   tier:'common', weight:3, stack:12, gatherAmt:[1,3]},
  stone:   {label:'Stone',  tier:'common', weight:3, stack:12, gatherAmt:[1,2]},
  metal:   {label:'Metal',  tier:'rare',   weight:4, stack:6,  gatherAmt:[1,1]},
  tools:   {label:'Tools',  tier:'rare',   weight:3, stack:6,  gatherAmt:[1,1]},
  fiber:   {label:'Fiber',  tier:'common', weight:1, stack:10, gatherAmt:[1,3]},
  herb:    {label:'Herb',   tier:'rare',   weight:1, stack:8,  gatherAmt:[1,1]},
  leather: {label:'Leather',tier:'rare',   weight:2, stack:8,  gatherAmt:[1,1]},
  seeds:   {label:'Seeds',  tier:'rare',   weight:1, stack:6,  gatherAmt:[1,1]},
  ticket:  {label:'Land Expansion Ticket', tier:'super', weight:0, stack:3, special:true},

  water:      {label:'Water',        tier:'common', weight:1, stack:10, gatherAmt:[1,2], consumable:true, thirstRestore:30},
  apple:      {label:'Apple',        tier:'common', weight:1, stack:8,  gatherAmt:[1,2], consumable:true, nutrition:16, shelfLife:4},
  berries:    {label:'Berries',      tier:'common', weight:1, stack:10, gatherAmt:[1,3], consumable:true, nutrition:11, shelfLife:3},
  vegetable:  {label:'Vegetable',    tier:'common', weight:1, stack:8,  gatherAmt:[1,2], consumable:true, nutrition:18, shelfLife:5},
  mushroom:   {label:'Mushroom',     tier:'common', weight:1, stack:8,  gatherAmt:[1,2], consumable:true, nutrition:13, shelfLife:4},
  grain:      {label:'Grain',        tier:'common', weight:1, stack:10, gatherAmt:[1,2], consumable:true, nutrition:15, shelfLife:9},
  meat_raw:   {label:'Raw Meat',     tier:'rare',   weight:2, stack:6,  gatherAmt:[1,1], consumable:true, nutrition:24, shelfLife:2, rawRisk:true},
  fish_raw:   {label:'Raw Fish',     tier:'rare',   weight:1, stack:6,  gatherAmt:[1,1], consumable:true, nutrition:20, shelfLife:2, rawRisk:true},

  cooked_meat:    {label:'Cooked Meat',      tier:'rare', weight:1, stack:8,  special:true, consumable:true, nutrition:34, healthRestore:3, shelfLife:4},
  cooked_fish:    {label:'Cooked Fish',      tier:'rare', weight:1, stack:8,  special:true, consumable:true, nutrition:29, healthRestore:3, shelfLife:4},
  roasted_veg:    {label:'Roasted Vegetable',tier:'rare', weight:1, stack:8,  special:true, consumable:true, nutrition:27, healthRestore:4, shelfLife:7},
  porridge:       {label:'Porridge',         tier:'rare', weight:1, stack:8,  special:true, consumable:true, nutrition:24, thirstRestore:12, healthRestore:2, shelfLife:6},
  dried_fruit:    {label:'Dried Fruit',      tier:'rare', weight:1, stack:10, special:true, consumable:true, nutrition:14, shelfLife:14},
  dried_meat:     {label:'Dried Meat',       tier:'rare', weight:1, stack:10, special:true, consumable:true, nutrition:30, shelfLife:16},
  preserved_meal: {label:'Preserved Meal',   tier:'super',weight:1, stack:6,  special:true, consumable:true, nutrition:42, healthRestore:12, shelfLife:20},
  rare_ration:    {label:'Rare Ration',      tier:'super',weight:1, stack:4,  special:true, consumable:true, nutrition:50, healthRestore:8, shelfLife:12},

  medicine:        {label:'Medicine',        tier:'rare',  weight:1, stack:6, gatherAmt:[1,1], consumable:true, healthRestore:35, staminaRestore:15},
  bandage:         {label:'Bandage',         tier:'rare',  weight:1, stack:8, special:true, consumable:true, healthRestore:25},
  strong_medicine: {label:'Strong Medicine', tier:'super', weight:1, stack:4, special:true, consumable:true, healthRestore:60, staminaRestore:25},
  trauma_kit:      {label:'Trauma Kit',      tier:'super', weight:1, stack:2, special:true, consumable:true, healthRestore:100},
};

const BLUEPRINT_META = {
  house:          {label:'Blueprint: Shelter'},
  house_t2:       {label:'Blueprint: Reinforced Shelter'},
  house_t3:       {label:'Blueprint: Fortified Shelter'},
  farm:           {label:'Blueprint: Farm Plot'},
  farm_t2:        {label:'Blueprint: Greenhouse'},
  kitchen:        {label:'Blueprint: Kitchen'},

/* ---------------- SAVE / LOAD (browser localStorage — works standalone, e.g. on GitHub Pages) ---------------- */
const SAVE_KEY = 'skyfall-save-v1';
async function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Save failed', e); }
}
async function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* no save yet, or storage unavailable */ }
  return null;
}
async function deleteSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ---------------- CHARACTER CREATION ---------------- */
const charDraft = { name:'', pool:15, base:3, max:10, attrs:{ STR:3, AGI:3, VIT:3, END:3, INT:3, PER:3 } };
function charPointsUsed(){ return Object.values(charDraft.attrs).reduce((a,b)=>a+b,0) - charDraft.base*6; }
function charPointsLeft(){ return charDraft.pool - charPointsUsed(); }

function renderCharCreate(){
  document.getElementById('charCreateScreen').style.display = 'flex';
  document.querySelector('.grid').style.display = 'none';
  document.querySelector('header').style.display = 'none';
  const left = charPointsLeft();
  const rows = Object.entries(charDraft.attrs).map(([k,v])=>`
    <div class="attr" style="justify-content:space-between;">
      <span class="attr-name">${k}</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="attr-plus show" data-cc-minus="${k}" ${v<=charDraft.base?'disabled':''} style="opacity:${v<=charDraft.base?0.3:1};">−</button>
        <span class="attr-val" style="min-width:18px;text-align:center;">${v}</span>
        <button class="attr-plus show" data-cc-plus="${k}" ${(v>=charDraft.max||left<=0)?'disabled':''} style="opacity:${(v>=charDraft.max||left<=0)?0.3:1};">+</button>
      </div>
    </div>`).join('');
  document.getElementById('charCreateBody').innerHTML = `
    <p class="scene-desc">Every survivor starts on a 1×1 meter floating plot with almost nothing. How you're built shapes how you survive — choose carefully.</p>
    <div class="section-label">Name</div>
    <input id="ccNameInput" type="text" maxlength="20" placeholder="Survivor" value="${charDraft.name}"
      style="width:100%;background:var(--bg-deep);border:1px solid var(--border-dim);color:var(--text);padding:10px 12px;border-radius:2px;font-family:'IBM Plex Sans',sans-serif;font-size:0.85rem;margin-bottom:14px;">
    <div class="section-label">Attributes — ${left} point${left!==1?'s':''} left</div>
    <div class="attrs" style="grid-template-columns:1fr 1fr;">${rows}</div>
    <div class="btn-row">
      <button class="btn primary" id="ccConfirmBtn">Begin</button>
    </div>
  `;
  document.getElementById('ccNameInput').oninput = (e)=>{ charDraft.name = e.target.value; };
  document.querySelectorAll('[data-cc-plus]').forEach(b=>{
    b.onclick = ()=>{ const k=b.getAttribute('data-cc-plus'); if(charDraft.attrs[k]<charDraft.max && charPointsLeft()>0){ charDraft.attrs[k]++; renderCharCreate(); } };
  });
  document.querySelectorAll('[data-cc-minus]').forEach(b=>{
    b.onclick = ()=>{ const k=b.getAttribute('data-cc-minus'); if(charDraft.attrs[k]>charDraft.base){ charDraft.attrs[k]--; renderCharCreate(); } };
  });

    document.querySelector('.grid').style.display = '';
    document.querySelector('header').style.display = '';

  };
}

async function initGame(){

    state.view = 'home';

/* ---------------- EQUIPMENT: owned tier vs usable tier ---------------- */
function usableTier(ownedTier){
  let usable = 0;
  for(let t=1; t<=ownedTier; t++){ if(state.level >= TIER_LEVEL_REQ[t]) usable = t; }
  return usable;
}
function effWeaponBonus(){ return WEAPON_BONUS[usableTier(state.equipment.weaponTier)]; }
function effArmorBonus(){ return ARMOR_BONUS[usableTier(state.equipment.armorTier)]; }
function effBackpackBonus(){ return BACKPACK_BONUS[usableTier(state.equipment.backpackTier)]; }
function effClothingMult(){ return CLOTHING_MULT[usableTier(state.equipment.clothingTier)]; }

/* ---------------- ATTRIBUTE-DERIVED VALUES ---------------- */
function maxHealth(){ return 50 + state.attrs.END*10; }
function maxStamina(){ return 50 + state.attrs.VIT*10; }
function carryWeightCap(){ return 20 + effBackpackBonus(); } // flat base while scavenging; STR no longer inflates this
function dodgeChance(){ return clamp(state.attrs.AGI*1.5, 0, 40)/100; }
function xpMultiplier(){ return 1 + state.attrs.INT*0.02; }
function ambushReduction(){ return clamp(state.attrs.PER*0.006, 0, 0.35); }
function storageWeightCap(){ return 70 + (STORAGE_SHED_BONUS[state.structures.storageShed]||0); }

function carriedTotal(){ return Object.values(state.carried).reduce((a,b)=>a+b,0); }
function carriedWeight(){ return Object.entries(state.carried).reduce((sum,[k,v])=> sum + (RESOURCE_META[k].weight||0)*v, 0); }
function storageWeight(){ return Object.entries(state.storage).reduce((sum,[k,v])=> sum + (RESOURCE_META[k].weight||0)*v, 0); }
function xpNeeded(lvl){ return 80 + (lvl-1)*40; }
function deathLossPercent(level){
  if(level < 10) return 0.80;
  if(level < 15) return 0.70;
  if(level < 20) return 0.50;
  return 0.35;
}
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function pickWeighted(entries){
  const total = entries.reduce((s,e)=>s+e.weight,0);
  let r = Math.random()*total;
  for(const e of entries){ if(r < e.weight) return e; r -= e.weight; }
  return entries[entries.length-1];
}
function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

function log(msg, cls){
  const list = document.getElementById('logList');
  const div = document.createElement('div');
  div.className = 'log-entry' + (cls ? ' '+cls : '');
  const tag = document.createElement('span');
  tag.className = 'tag'; tag.textContent = `[D${state.day}]`;
  div.appendChild(tag);
  div.appendChild(document.createTextNode(msg));
  list.prepend(div);
}

function addXP(amount){
  state.xp += Math.round(amount * xpMultiplier());
  while(state.xp >= state.xpToNext){
    state.xp -= state.xpToNext;
    state.level += 1;
    state.xpToNext = xpNeeded(state.level);
    state.attrPoints += 2;
    log(`Level up — you are now Level ${state.level}. 2 attribute points available.`, 'good');
    if([5,10,15,20].includes(state.level)) log(`Milestone reached: Level ${state.level} unlocks new Tier-appropriate structure upgrades and lets you use higher-tier equipment, if you have it.`, 'super');
  }
}

function addToCarried(res, n){
  const meta = RESOURCE_META[res];
  const stackRoom = meta.stack - (state.carried[res]||0);
  if(stackRoom <= 0){ log(`Can't carry more ${meta.label} — stack full.`, 'bad'); return 0; }
  let weightRoom = Infinity;
  if(meta.weight > 0){ weightRoom = Math.floor((carryWeightCap() - carriedWeight()) / meta.weight); }
  const add = Math.max(0, Math.min(n, stackRoom, weightRoom));
  if(add <= 0){ log(`Too heavy to carry ${meta.label} — leave something behind first.`, 'bad'); return 0; }
  state.carried[res] = (state.carried[res]||0) + add;
  if(add < n) log(`Could only carry ${add}/${n} ${meta.label} (weight/stack limit).`, 'bad');
  return add;
}
function addToStorage(res, n){
  const meta = RESOURCE_META[res];
  let weightRoom = Infinity;
  if(meta.weight > 0){ weightRoom = Math.floor((storageWeightCap() - storageWeight()) / meta.weight); }
  const add = Math.max(0, Math.min(n, weightRoom));
  state.storage[res] = (state.storage[res]||0) + add;
  if(add < n) log(`Storage is full — only ${add}/${n} ${meta.label} fit. Build/upgrade a Storage Shed for more room.`, 'bad');
  return add;
}
function hasMaterials(cost){ return Object.entries(cost).every(([k,v]) => (state.storage[k]||0) >= v); }
function spendMaterials(cost){ Object.entries(cost).forEach(([k,v]) => state.storage[k] -= v); }
function costString(cost){ return Object.entries(cost).map(([k,v])=>`${v} ${RESOURCE_META[k].label}`).join(', '); }

/* ---------------- FOOD SPOILAGE ---------------- */
function decayStorage(){
  const spoiled = [];
  Object.keys(state.storage).forEach(key=>{
    const meta = RESOURCE_META[key];
    if(!meta || !meta.shelfLife) return;
    let qty = state.storage[key];
    if(qty <= 0) return;
    const spoilChance = clamp(1/meta.shelfLife, 0, 0.55);
    let lost = 0;
    for(let i=0;i<qty;i++){ if(Math.random() < spoilChance) lost++; }
    if(lost > 0){ state.storage[key] -= lost; spoiled.push(`${lost} ${meta.label}`); }
  });
  if(spoiled.length) log(`Spoiled overnight: ${spoiled.join(', ')}.`, 'bad');
}

/* ---------------- WORLD EVENTS ---------------- */
function eventEffect(field, zoneKey){
  const ev = state.worldEvent;
  if(!ev) return null;
  if(ev.zone && ev.zone !== zoneKey) return null;
  return ev.effect[field] !== undefined ? ev.effect[field] : null;
}
function maybeAdvanceWorldEvent(){
  if(state.worldEvent){
    if(state.day >= state.worldEvent.expiresDay){
      log(`${state.worldEvent.label} has ended.`, 'good');
      state.worldEvent = null;
    } else return;
  }
  if(Math.random() < 0.25){
    const def = WORLD_EVENTS[Math.floor(Math.random()*WORLD_EVENTS.length)];
    const dur = randInt(def.duration[0], def.duration[1]);
    const zoneKeys = Object.keys(ZONES);
    const zone = def.singleZone ? zoneKeys[Math.floor(Math.random()*zoneKeys.length)] : null;
    state.worldEvent = { key:def.key, label:def.label, desc:def.desc, effect:def.effect, expiresDay: state.day+dur, zone };
    log(`World event: ${def.label}${zone?` — ${ZONES[zone].label}`:''}. ${def.desc}`, 'super');
  }
}
function eventBannerHTML(zoneKeyFilter){
  const ev = state.worldEvent;
  if(!ev) return '';
  if(zoneKeyFilter !== undefined && ev.zone && ev.zone !== zoneKeyFilter) return '';
  return `<div class="event-banner"><b>${ev.label}</b>${ev.zone?` — ${ZONES[ev.zone].label}`:' — everywhere'}: ${ev.desc}</div>`;
}

/* ---------------- LAND / STRUCTURES (tiered) ---------------- */
function effectiveFootprint(key, tierNum){
  if(tierNum <= 0) return 0;
  const def = STRUCTURE_TIERS[key][tierNum-1];
  if(key === 'kitchen' && state.structures.house > 0) return def.footprintInHouse;
  return def.footprint;
}
function usedArea(){ return Object.entries(state.structures).reduce((sum,[k,tier])=> sum + effectiveFootprint(k, tier), 0); }
function freeArea(){ return state.land.area - usedArea(); }
function nextTierReqs(key){
  const curTier = state.structures[key];
  const defs = STRUCTURE_TIERS[key];
  if(curTier >= defs.length) return null;
  return { tierNum: curTier+1, def: defs[curTier] };
}
function canBuildNextTier(key){
  const req = nextTierReqs(key);
  if(!req) return {ok:false, reason:'Maxed out.'};
  const d = req.def;
  if(d.needsLevel && state.level < d.needsLevel) return {ok:false, reason:`Requires Level ${d.needsLevel}`};
  if(d.needsBuildingStation && state.structures.buildingStation < 1) return {ok:false, reason:'Requires Building Station'};
  if(d.needsBlueprint && !state.blueprints[d.needsBlueprint]) return {ok:false, reason:`Requires ${BLUEPRINT_META[d.needsBlueprint].label}`};
  const delta = effectiveFootprint(key, req.tierNum) - effectiveFootprint(key, state.structures[key]);
  if(freeArea() < delta) return {ok:false, reason:`Requires ${delta} more sqm of land`};
  if(!hasMaterials(d.cost)) return {ok:false, reason:'Missing materials'};
  return {ok:true};
}

/* ---------------- SYSTEM MODAL ---------------- */
function showSystem({tag='// SYSTEM', title, body, actions, danger=false}){
  document.getElementById('sysTag').textContent = tag;
  document.getElementById('sysTitle').textContent = title;
  document.getElementById('sysBody').innerHTML = body;
  document.getElementById('sysBox').className = 'sys-box' + (danger ? ' danger' : '');
  const actionsEl = document.getElementById('sysActions');
  actionsEl.innerHTML = '';
  actions.forEach(a=>{
    const btn = document.createElement('button');
    btn.className = 'sys-btn' + (a.secondary ? ' secondary':'');
    btn.textContent = a.label;
    btn.onclick = () => { hideSystem(); a.onClick && a.onClick(); };
    actionsEl.appendChild(btn);
  });
  document.getElementById('sysOverlay').classList.add('show');
}
function hideSystem(){ document.getElementById('sysOverlay').classList.remove('show'); }

/* ---------------- RENDER ---------------- */
function tempLabel(t){
  if(t < 20) return 'Freezing'; if(t < 40) return 'Cold';
  if(t <= 60) return 'Neutral'; if(t <= 80) return 'Hot';
  return 'Scorching';
}

function render(){
  const nameTag = document.getElementById('playerNameTag');
  if(nameTag) nameTag.textContent = `${state.playerName || 'Survivor'} — Level ${state.level}`;
  document.getElementById('dayNum').textContent = state.day;
  const daysLeft = state.nextTrialDay - state.day;
  document.getElementById('trialNote').textContent = daysLeft <= 3 && daysLeft >= 0 ? `Trial in ${daysLeft} day${daysLeft!==1?'s':''}` : '';

  document.getElementById('lvlVal').textContent = `Lv. ${state.level}`;
  document.getElementById('xpText').textContent = `${state.xp}/${state.xpToNext} XP`;
  document.getElementById('xpBar').style.width = `${(state.xp/state.xpToNext)*100}%`;

  setBar('health', state.health, maxHealth());
  setBar('hunger', state.hunger, 100);
  setBar('thirst', state.thirst, 100);
  setBar('stamina', state.stamina, maxStamina());
  document.getElementById('tempText').textContent = tempLabel(state.temperature);
  document.getElementById('tempBar').style.width = `${state.temperature}%`;
  setBar('weight', carriedWeight(), carryWeightCap());

  const attrsBox = document.getElementById('attrsBox');
  attrsBox.innerHTML = '';
  Object.entries(state.attrs).forEach(([k,v])=>{
    const el = document.createElement('div');
    el.className = 'attr';
    el.innerHTML = `<span class="attr-name">${k}</span><span class="attr-val">${v}</span>`;
    if(state.attrPoints > 0){
      const btn = document.createElement('button');
      btn.className = 'attr-plus show'; btn.textContent = '+';
      btn.onclick = () => { state.attrs[k]++; state.attrPoints--; render(); };
      el.appendChild(btn);
    }
    attrsBox.appendChild(el);
  });
  const banner = document.getElementById('pointsBanner');
  if(state.attrPoints > 0){ banner.textContent = `${state.attrPoints} attribute point${state.attrPoints>1?'s':''} available`; banner.classList.add('show'); }
  else banner.classList.remove('show');

  const equipParts = [
    `Carry cap: ${carryWeightCap()}wt (base 20 + Bag)`, `Max HP: ${maxHealth()} (END)`, `Max Stamina: ${maxStamina()} (VIT)`,
    `Dodge: ${Math.round(dodgeChance()*100)}% (AGI)`, `XP bonus: +${Math.round((xpMultiplier()-1)*100)}% (INT)`,
    `Ambush alert: -${Math.round(ambushReduction()*100)}% (PER)`,
  ];
  const eq = state.equipment;
  const slotNote = (name, owned, usableFn) => {
    if(owned === 0) return null;
    const usable = usableTier(owned);
    if(usable === owned) return `${name} T${owned}`;
    return `${name} T${owned} <span class="gate">(usable T${usable} — need Lv.${TIER_LEVEL_REQ[owned]})</span>`;
  };
  [['Weapon',eq.weaponTier],['Armor',eq.armorTier],['Bag',eq.backpackTier],['Clothing',eq.clothingTier]].forEach(([name,tier])=>{
    const note = slotNote(name, tier);
    if(note) equipParts.push(note);
  });
  document.getElementById('equipRow').innerHTML = equipParts.join(' · ');

  document.getElementById('storageCapNote').innerHTML = `Capacity: <b>${Math.round(storageWeight())}/${storageWeightCap()}</b> weight`;

  const storageList = document.getElementById('storageList');
  storageList.innerHTML = '';
  const entries = Object.entries(state.storage).filter(([k,v])=>v>0);
  const bpOwned = Object.entries(state.blueprints).filter(([k,v])=>v);
  document.getElementById('storageCount').textContent = entries.length ? `(${entries.length} types)` : '';
  if(entries.length === 0 && bpOwned.length === 0){
    storageList.innerHTML = '<div class="empty-note">Empty. Venture out to gather supplies.</div>';
  } else {
    entries.forEach(([k,v])=>{
      const meta = RESOURCE_META[k];
      const tierClass = meta.tier === 'rare' ? 'rare' : meta.tier === 'super' ? 'super' : '';
      const row = document.createElement('div');
      row.className = 'res-row';
      const shelfNote = meta.shelfLife ? ` <span style="opacity:0.6;">(~${meta.shelfLife}d)</span>` : '';
      row.innerHTML = `<span class="res-name ${tierClass} ${meta.special?'special':''}">${meta.label}${shelfNote}</span><span class="res-val">${v}</span>`;
      storageList.appendChild(row);
    });
    bpOwned.forEach(([k])=>{
      const row = document.createElement('div');
      row.className = 'res-row';
      row.innerHTML = `<span class="res-name special">${BLUEPRINT_META[k].label}</span><span class="res-val">owned</span>`;
      storageList.appendChild(row);
    });
  }

  renderMain();
  saveGame();
}

function setBar(id, val, max){
  const pct = clamp((val/max)*100, 0, 100);
  document.getElementById(id+'Text').textContent = `${Math.round(val)}/${Math.round(max)}`;
  const bar = document.getElementById(id+'Bar');
  bar.style.width = pct+'%';
  bar.className = `bar-fill ${id}` + (id!=='weight' && val < max*0.3 ? ' low' : '');
}

function renderMain(){
  const panel = document.getElementById('mainPanel');
  if(state.view === 'combat' && state.combat){ renderCombat(panel); return; }
  if(state.view === 'zoneselect'){ renderZoneSelect(panel); return; }
  if(state.view === 'expedition'){ renderExpedition(panel); return; }
  if(state.view === 'extraction'){ renderExtraction(panel); return; }
  if(state.view === 'beacon'){ renderBeacon(panel); return; }
  renderHome(panel);
}

function consumeListHTML(source){
  const bag = source === 'storage' ? state.storage : state.carried;
  const items = Object.entries(bag).filter(([k,v]) => v > 0 && RESOURCE_META[k].consumable);
  if(items.length === 0) return `<div class="section-label">Consume</div><div class="empty-note">Nothing to eat, drink, or use right now.</div>`;
  const rows = items.map(([k,v])=>{
    const meta = RESOURCE_META[k];
    const bits = [];
    if(meta.nutrition) bits.push(`+${meta.nutrition} hunger`);
    if(meta.thirstRestore) bits.push(`+${meta.thirstRestore} thirst`);
    if(meta.healthRestore) bits.push(`+${meta.healthRestore} HP`);
    if(meta.staminaRestore) bits.push(`+${meta.staminaRestore} stamina`);
    if(meta.rawRisk) bits.push('raw — risk of food poisoning');
    return `<div class="consume-row">
      <span class="cr-name">${meta.label} <span class="cr-meta">(${v})</span></span>
      <span class="cr-meta">${bits.join(', ')}</span>
      <button class="btn small" data-consume="${k}" data-source="${source}">Use</button>
    </div>`;
  }).join('');
  return `<div class="section-label">Consume</div><div class="consume-list">${rows}</div>`;
}
function wireConsumeList(){
  document.querySelectorAll('[data-consume]').forEach(btn=>{
    btn.onclick = () => consume(btn.getAttribute('data-source'), btn.getAttribute('data-consume'));
  });
}
function consume(source, key){
  const bag = source === 'storage' ? state.storage : state.carried;
  if((bag[key]||0) < 1) return;
  bag[key] -= 1;
  const meta = RESOURCE_META[key];
  if(meta.nutrition) state.hunger = clamp(state.hunger + meta.nutrition, 0, 100);
  if(meta.thirstRestore) state.thirst = clamp(state.thirst + meta.thirstRestore, 0, 100);
  if(meta.healthRestore) state.health = clamp(state.health + meta.healthRestore, 0, maxHealth());
  if(meta.staminaRestore) state.stamina = clamp(state.stamina + meta.staminaRestore, 0, maxStamina());
  if(meta.rawRisk && Math.random() < 0.3){
    state.health = clamp(state.health - 10, 0, maxHealth());
    log(`Ate ${meta.label} raw — mild food poisoning.`, 'bad');
  } else {
    log(`Consumed ${meta.label}.`, 'good');
  }
  render();
}

function openBuildMenu(){
  const rows = Object.keys(STRUCTURE_TIERS).map(key=>{
    const curTier = state.structures[key];
    const maxed = curTier >= STRUCTURE_TIERS[key].length;
    if(maxed){
      return `<div class="build-item"><div><div class="bi-name">${STRUCTURE_TIERS[key][curTier-1].label} <span style="color:var(--moss);">— Max Tier</span></div></div></div>`;
    }
    const req = nextTierReqs(key);
    const check = canBuildNextTier(key);
    const fpDelta = effectiveFootprint(key, req.tierNum) - effectiveFootprint(key, curTier);
    return `<div class="build-item">
      <div><div class="bi-name">${req.def.label} ${curTier>0?`<span style="color:var(--text-dim);font-weight:400;">(upgrade from T${curTier})</span>`:''}${check.ok?'':` <span style="color:var(--ember);">(${check.reason})</span>`}</div>
      <div class="bi-cost">${costString(req.def.cost)} — ${fpDelta} sqm${req.def.footprintInHouse!==undefined && state.structures.house>0 ? ' (fits inside Shelter, free)':''}</div>
      <div class="bi-cost" style="color:var(--text-dim);">${req.def.desc}</div></div>
      <button class="btn small ${check.ok?'primary':''}" ${check.ok?'':'disabled'} onclick="buildOrUpgrade('${key}')">${curTier===0?'Build':'Upgrade'}</button>
    </div>`;
  }).join('');
  showSystem({tag:'// BUILD', title:`Build / Upgrade (${freeArea()} sqm free of ${state.land.area})`, body:`<div class="build-list">${rows}</div>`, actions:[{label:'Close', secondary:true, onClick:render}]});
}
window.buildOrUpgrade = function(key){
  const check = canBuildNextTier(key);
  if(!check.ok) return;
  const req = nextTierReqs(key);
  spendMaterials(req.def.cost);
  state.structures[key] = req.tierNum;
  log(`${req.tierNum===1?'Built':'Upgraded'} ${req.def.label} (Tier ${req.tierNum}).`, 'good');
  hideSystem(); render();
};

function expandLand(){
  if((state.storage.ticket||0) < 1 || state.storage.wood < 4 || state.storage.stone < 4) return;
  state.storage.ticket -= 1; state.storage.wood -= 4; state.storage.stone -= 4;
  state.land.area += 3;
  log('Consumed a Land Expansion Ticket — your plot has grown by 3 sqm, extending outward from the existing land.', 'rare');
  render();
}

function openCraftMenu(){
  const wbTier = state.structures.workbench;
  const cats = {};
  Object.entries(CRAFTABLES).forEach(([key,c])=>{ (cats[c.category] = cats[c.category]||[]).push([key,c]); });
  let html = '';
  Object.entries(cats).forEach(([cat, items])=>{
    html += `<div class="build-cat">${cat}</div>`;
    items.forEach(([key,c])=>{
      const tierOk = wbTier >= c.tier;
      const bpOk = !c.needsBlueprint || state.blueprints[c.needsBlueprint];
      const matOk = hasMaterials(c.cost);
      const disabled = !tierOk || !bpOk || !matOk;
      let reason = !tierOk ? ` (needs Workbench T${c.tier})` : (!bpOk ? ' (needs blueprint)' : '');
      const effectLabel = c.effect==='weapon' ? `T${c.tier} weapon (+${WEAPON_BONUS[c.tier]} ATK once usable)` :
        c.effect==='armor' ? `T${c.tier} armor (-${ARMOR_BONUS[c.tier]} dmg once usable)` :
        c.effect==='clothing' ? `T${c.tier} clothing (cold resist once usable)` :
        c.effect==='backpack' ? `T${c.tier} bag (+${BACKPACK_BONUS[c.tier]}wt once usable)` :
        c.produce ? `produces ${c.produce.qty}× ${RESOURCE_META[c.produce.item].label}` : '';
      html += `<div class="build-item">
        <div><div class="bi-name">${c.label}${reason} <span style="color:var(--text-dim);font-weight:400;">— ${effectLabel}</span></div><div class="bi-cost">${costString(c.cost)}</div></div>
        <button class="btn small ${disabled?'':'primary'}" ${disabled?'disabled':''} onclick="craftItem('${key}')">Craft</button>
      </div>`;
    });
  });
  showSystem({tag:'// WORKBENCH', title:`Craft Equipment (Tier ${wbTier})`, body:`<div class="build-list">${html}</div>`, actions:[{label:'Close', secondary:true, onClick:render}]});
}
window.craftItem = function(key){
  const c = CRAFTABLES[key];
  if(state.structures.workbench < c.tier) return;
  if(c.needsBlueprint && !state.blueprints[c.needsBlueprint]) return;
  if(!hasMaterials(c.cost)) return;
  spendMaterials(c.cost);
  if(c.effect==='weapon') state.equipment.weaponTier = Math.max(state.equipment.weaponTier, c.tier);
  if(c.effect==='armor') state.equipment.armorTier = Math.max(state.equipment.armorTier, c.tier);
  if(c.effect==='clothing') state.equipment.clothingTier = Math.max(state.equipment.clothingTier, c.tier);
  if(c.effect==='backpack') state.equipment.backpackTier = Math.max(state.equipment.backpackTier, c.tier);
  if(c.produce) addToStorage(c.produce.item, c.produce.qty);
  const usable = c.effect ? usableTier(state.equipment[{weapon:'weaponTier',armor:'armorTier',clothing:'clothingTier',backpack:'backpackTier'}[c.effect]]) : c.tier;
  log(`Crafted ${c.label} (Tier ${c.tier})${c.effect && usable<c.tier ? ` — need Level ${TIER_LEVEL_REQ[c.tier]} to actually use it`:''}.`, 'good');
  hideSystem(); render();
};

function openFarmMenu(){
  const tier = state.structures.farm;
  const growDays = tier >= 2 ? 2 : 3;
  let body;
  if(!state.farm.planted){
    const canPlant = (state.storage.seeds||0) >= 1 && (state.storage.water||0) >= 1;
    body = `Plant seeds to grow vegetables over ${growDays} days. Requires 1 Seed + 1 Water to plant.<br><br>${canPlant ? '' : '<i style="color:var(--ember);">Missing seeds or water.</i>'}`;
    showSystem({tag:'// FARM', title:`Farm Plot (Tier ${tier})`, body, actions:[
      {label:'Plant (1 Seed + 1 Water)', onClick: canPlant ? plantFarm : ()=>{}},
      {label:'Close', secondary:true, onClick:render}
    ]});
  } else {
    const daysLeft = state.farm.readyDay - state.day;
    if(daysLeft <= 0){
      body = 'Your crop has grown. Ready to harvest.';
      showSystem({tag:'// FARM', title:'Farm Plot', body, actions:[
        {label:'Harvest', onClick: harvestFarm},
        {label:'Close', secondary:true, onClick:render}
      ]});
    } else {
      body = `Crop growing — ready in ${daysLeft} day${daysLeft!==1?'s':''}.`;
      showSystem({tag:'// FARM', title:'Farm Plot', body, actions:[{label:'Close', secondary:true, onClick:render}]});
    }
  }
}
function plantFarm(){
  if((state.storage.seeds||0) < 1 || (state.storage.water||0) < 1) return;
  const growDays = state.structures.farm >= 2 ? 2 : 3;
  state.storage.seeds -= 1; state.storage.water -= 1;
  state.farm = { planted:true, plantedDay: state.day, readyDay: state.day + growDays };
  log('Planted seeds on the Farm Plot.', 'good');
  hideSystem(); render();
}
function harvestFarm(){
  const yieldAmt = state.structures.farm >= 2 ? randInt(4,7) : randInt(2,4);
  addToStorage('vegetable', yieldAmt);
  state.farm = { planted:false, plantedDay:null, readyDay:null };
  log(`Harvested ${yieldAmt} Vegetable from the farm.`, 'good');
  hideSystem(); render();
}

function openKitchenMenu(){
  const tier = state.structures.kitchen;
  const items = Object.entries(KITCHEN_RECIPES).map(([key,r])=>{
    const tierOk = tier >= r.minTier;
    const matOk = hasMaterials(r.cost);
    const disabled = !tierOk || !matOk;
    return `<div class="build-item">
      <div><div class="bi-name">${r.label} <span style="color:var(--text-dim);font-weight:400;">— ${r.method}</span>${tierOk?'':' <span style="color:var(--ember);">(needs Advanced Kitchen)</span>'}</div>
      <div class="bi-cost">${costString(r.cost)} → ${r.produces.qty}× ${RESOURCE_META[r.produces.item].label}</div>
      <div class="bi-cost" style="color:var(--text-dim);">${r.note}</div></div>
      <button class="btn small ${disabled?'':'primary'}" ${disabled?'disabled':''} onclick="cookRecipe('${key}')">Make</button>
    </div>`;
  }).join('');
  showSystem({tag:'// KITCHEN', title:`Prepare Food (Tier ${tier})`, body:`<div class="build-list">${items}</div>`, actions:[{label:'Close', secondary:true, onClick:render}]});
}
window.cookRecipe = function(key){
  const r = KITCHEN_RECIPES[key];
  if(state.structures.kitchen < r.minTier || !hasMaterials(r.cost)) return;
  spendMaterials(r.cost);
  addToStorage(r.produces.item, r.produces.qty);
  log(`${r.method}: made ${r.produces.qty}× ${RESOURCE_META[r.produces.item].label}.`, 'good');
  hideSystem(); render();
};

    return `<div class="build-item">
      <div><div class="bi-name">${r.label}${reason}</div>
      <div class="bi-cost">${costString(r.cost)} → ${r.produces.qty}× ${RESOURCE_META[r.produces.item].label}</div></div>
      <button class="btn small ${disabled?'':'primary'}" ${disabled?'disabled':''} onclick="medicalCraft('${key}')">Make</button>
    </div>`;
  }).join('');
  showSystem({tag:'// MEDICAL STATION', title:`Treatment (Tier ${tier})`, body:`<div class="build-list">${items}</div>`, actions:[{label:'Close', secondary:true, onClick:render}]});
}
window.medicalCraft = function(key){
  const r = MEDICAL_RECIPES[key];
  if(state.structures.medical < r.minTier) return;
  if(r.needsBlueprint && !state.blueprints[r.needsBlueprint]) return;
  if(!hasMaterials(r.cost)) return;
  spendMaterials(r.cost);
  addToStorage(r.produces.item, r.produces.qty);
  log(`Prepared ${r.produces.qty}× ${RESOURCE_META[r.produces.item].label}.`, 'good');
  hideSystem(); render();
};

/* ---------------- HOME: REST ---------------- */
function bestFoodKey(bag){
  const candidates = Object.entries(bag).filter(([k,v]) => v > 0 && RESOURCE_META[k].nutrition);
  if(candidates.length === 0) return null;
  candidates.sort((a,b) => RESOURCE_META[b[0]].nutrition - RESOURCE_META[a[0]].nutrition);
  return candidates[0][0];
}
function restAtHome(){
  const foodKey = bestFoodKey(state.storage);
  if(foodKey){
    state.storage[foodKey] -= 1;
    const meta = RESOURCE_META[foodKey];
    state.hunger = 100;
    if(meta.healthRestore) state.health = clamp(state.health + meta.healthRestore, 0, maxHealth());
    if(meta.rawRisk && Math.random() < 0.3){ state.health = clamp(state.health - 10, 0, maxHealth()); log(`Ate raw ${meta.label} — mild food poisoning.`, 'bad'); }
  } else {
    state.health = clamp(state.health - 8, 0, maxHealth());
    log('No food to eat — hunger unrestored and health suffers.', 'bad');
  }

  if((state.storage.water||0) > 0){ state.storage.water -= 1; state.thirst = 100; }
  else { state.health = clamp(state.health - 8, 0, maxHealth()); log('No water to drink — thirst unrestored and health suffers.', 'bad'); }

  state.stamina = maxStamina();
  const houseTier = state.structures.house;
  const regenRate = houseTier >= 3 ? 0.99 : houseTier >= 2 ? 0.95 : houseTier >= 1 ? 0.9 : (state.structures.campfire ? 0.65 : 0.5);
  state.temperature += (50 - state.temperature) * regenRate;
  if(houseTier >= 3) state.stamina = clamp(state.stamina + 10, 0, maxStamina());
  state.day += 1;
  decayStorage();
  maybeAdvanceWorldEvent();

  log('You rest. Day advances.', 'good');
  render();

  if(state.day >= state.nextTrialDay){ triggerMonsterTrial(); }
}

/* ---------------- TRIAL ---------------- */
function triggerMonsterTrial(){
  const pool = ['goblin','wolf','skeleton'];
  const key = pool[Math.min(Math.floor(state.level/6), pool.length-1)];
  const base = MONSTER_STATS[key];
  const mult = 1 + state.level*0.13;
  const monster = {
    key, name: `Trial ${base.name}`,
    hp: Math.round(base.hp*mult), maxHp: Math.round(base.hp*mult),
    atkMin: Math.round(base.atkMin*mult), atkMax: Math.round(base.atkMax*mult),
    speed: base.speed, xp: base.xp,
  };
  showSystem({
    tag:'// SYSTEM — TRIAL ARRIVING', title:'The System Has Marked Your Plot',
    body:`<b>${monster.name}</b> is inbound to test your progress. This is not optional — prepare yourself.`,
    danger:true, actions:[{label:'Face It', onClick: () => startCombat('trial', monster)}]
  });
}

function renderExpedition(panel){

    </div>

function makeMonsterFor(zoneKey, depthHint){
  const z = ZONES[zoneKey];
  const key = z.monsterPool[Math.floor(Math.random()*z.monsterPool.length)];
  const base = MONSTER_STATS[key];
  const eliteChance = eventEffect('eliteChance', zoneKey) || 0;
  const elite = Math.random() < eliteChance;
  const mult = elite ? 1.7 : 1;
  return {
    key, name: elite ? `Elite ${base.name}` : base.name,
    hp: Math.round(base.hp*mult), maxHp: Math.round(base.hp*mult),
    atkMin: Math.round(base.atkMin*mult), atkMax: Math.round(base.atkMax*mult),
    speed: base.speed, xp: Math.round(base.xp * (elite?2:1)), elite,
  };
}

function sitAndRest(){
  state.stamina = clamp(state.stamina + 25, 0, maxStamina());
  state.hunger = clamp(state.hunger - 3, 0, 100);
  state.thirst = clamp(state.thirst - 3, 0, 100);
  let ambushChance = clamp(0.10 - ambushReduction(), 0.02, 0.10);
  ambushChance *= (eventEffect('ambushMult', state.zone) || 1);
  if(Math.random() < ambushChance){
    log('Resting left you exposed — something found you.', 'bad');
    startCombat('world', makeMonsterFor(state.zone));
    return;
  }
  log('Sat and recovered stamina.', 'good');
  render();
}

function getZoneLootTable(zoneKey){
  return LOOT_TABLES[zoneKey].map(e=>{
    let w = e.weight;
    if(e.type==='common'){ const m=eventEffect('commonMult',zoneKey); if(m) w*=m; }
    if(e.type==='rare'){ const m=eventEffect('rareMult',zoneKey); if(m) w*=m; }
    if(e.type==='hazard'){ const m=eventEffect('hazardMult',zoneKey); if(m) w*=m; }
    if(e.type==='monster'){ const m=eventEffect('monsterMult',zoneKey); if(m) w*=m; }
    if(e.type==='blueprint'){ const m=eventEffect('blueprintMult',zoneKey); if(m) w*=m; }
    return { type:e.type, weight:w };
  });
}

function doExplore(){
  state.stamina = clamp(state.stamina - 1, 0, maxStamina());
  state.hunger = clamp(state.hunger - (2 + Math.random()*2), 0, 100);
  state.thirst = clamp(state.thirst - (3 + Math.random()*2), 0, 100);
  if(state.hunger <= 0 || state.thirst <= 0) state.health = clamp(state.health - 3, 0, maxHealth());

  const z = ZONES[state.zone];
  const outcome = pickWeighted(getZoneLootTable(state.zone));

  switch(outcome.type){
    case 'nothing':
      log('You search the area but find nothing worth taking.');
      break;
    case 'common': {
      const item = z.commonPool[Math.floor(Math.random()*z.commonPool.length)];
      const meta = RESOURCE_META[item];
      const amt = randInt(meta.gatherAmt[0], meta.gatherAmt[1]);
      if(addToCarried(item, amt) > 0){ addXP(1); log(`Found ${amt}× ${meta.label}.`); }
      break;
    }
    case 'rare': {
      const item = z.rarePool[Math.floor(Math.random()*z.rarePool.length)];
      if(addToCarried(item, 1) > 0){ addXP(4); log(`Rare find: 1× ${RESOURCE_META[item].label}.`, 'rare'); }
      break;
    }
    case 'super': {
      const item = Math.random() < 0.6 ? 'ticket' : 'rare_ration';
      if(addToCarried(item, 1) > 0){ addXP(7); log(`Super rare find: 1× ${RESOURCE_META[item].label}!`, 'super'); }
      break;
    }
    case 'jackpot': {
      const missing = Object.entries(state.blueprints).filter(([k,v])=>!v).map(([k])=>k);
      let msg = 'An extraordinary find! ';
      if(missing.length > 0 && Math.random() < 0.6){
        const bp = missing[Math.floor(Math.random()*missing.length)];
        state.blueprints[bp] = true;
        msg += `${BLUEPRINT_META[bp].label}, `;
      }
      const item = z.rarePool[Math.floor(Math.random()*z.rarePool.length)];
      if(addToCarried(item, 2) > 0) msg += `2× ${RESOURCE_META[item].label}, `;
      if(addToCarried('ticket', 1) > 0) msg += `1× Land Expansion Ticket. `;
      addXP(30);
      log(msg + '(+30 XP)', 'super');
      break;
    }
    case 'blueprint': {
      const missing = Object.entries(state.blueprints).filter(([k,v])=>!v).map(([k])=>k);
      if(missing.length === 0){
        const item = z.rarePool[Math.floor(Math.random()*z.rarePool.length)];
        if(addToCarried(item,1) > 0) log(`Found 1× ${RESOURCE_META[item].label} (all blueprints already known).`, 'rare');
      } else {
        const bp = missing[Math.floor(Math.random()*missing.length)];
        state.blueprints[bp] = true;
        addXP(10);
        log(`Found ${BLUEPRINT_META[bp].label}!`, 'super');
      }
      break;
    }
    case 'hazard': {
      const cold = Math.random() < 0.5;
      state.temperature = clamp(state.temperature + (cold ? -12 : 12) * effClothingMult(), 0, 100);
      log(`A sudden ${cold?'cold snap':'heat wave'} hits — exposure shifts your body temperature.`, 'bad');
      break;
    }
    case 'monster': {
      startCombat('world', makeMonsterFor(state.zone));
      return;
    }
  }

  if(state.health <= 0){ collapseFromExposure(); return; }
  render();
}

function collapseFromExposure(){
  showSystem({
    tag:'// SYSTEM — COLLAPSE', title:'Your Body Gives Out',
    body:'Starvation, dehydration, and exposure catch up with you all at once.',
    danger:true, actions:[{label:'Continue', onClick: () => deathPenalty('exposure')}]
  });
}

/* ---------------- EXTRACTION ---------------- */
function beginExtraction(){
  const z = ZONES[state.zone];
  state.extraction = { zone: state.zone, legsTotal: z.extractionLegs, legsDone: 0 };
  state.view = 'extraction';
  render();
}

function renderExtraction(panel){
  const ex = state.extraction;
  const dots = Array.from({length: ex.legsTotal}, (_,i)=>
    `<div class="leg-dot ${i < ex.legsDone ? 'done' : (i===ex.legsDone ? 'current':'')}"></div>`
  ).join('');
  panel.innerHTML = `
    <h2 class="scene-title">Heading to the Beacon</h2>
    <p class="scene-desc">Leg ${ex.legsDone+1} of ${ex.legsTotal}. You're carrying everything you found — if something finds you first, you could lose it all. Sprinting cuts ambush risk but burns real stamina; you can always walk, even exhausted.</p>
    <div class="leg-track">${dots}</div>
    <div class="exp-stats"><div class="exp-stat">Carried weight: <b>${carriedWeight()}/${carryWeightCap()}</b></div></div>
    <div class="btn-row">
      <button class="btn primary" id="walkBtn">Walk On</button>
      <button class="btn gold" id="sprintBtn" ${state.stamina < 10 ? 'disabled':''}>Sprint (half ambush risk)</button>
      <button class="btn moss" id="sitExBtn" ${state.stamina >= maxStamina()-1 ? 'disabled':''}>Sit and Rest (+Stamina)</button>
    </div>
  `;
  document.getElementById('walkBtn').onclick = () => travelLeg(false);
  document.getElementById('sprintBtn').onclick = () => travelLeg(true);
  document.getElementById('sitExBtn').onclick = sitDuringExtraction;
}

function sitDuringExtraction(){
  state.stamina = clamp(state.stamina + 25, 0, maxStamina());
  state.hunger = clamp(state.hunger - 3, 0, 100);
  state.thirst = clamp(state.thirst - 3, 0, 100);
  const z = ZONES[state.extraction.zone];
  let ambushChance = clamp(z.ambushBase*0.6 - ambushReduction(), 0.02, 0.3);
  ambushChance *= (eventEffect('ambushMult', state.extraction.zone) || 1);
  if(Math.random() < ambushChance){
    log('Resting mid-journey left you exposed.', 'bad');
    startCombat('extraction', makeMonsterFor(state.extraction.zone));
    return;
  }
  log('Recovered stamina on the trail.', 'good');
  render();
}

function travelLeg(sprint){
  const z = ZONES[state.extraction.zone];
  const weightFactor = 1 + Math.min(carriedWeight()/carryWeightCap(), 1) * 0.5;
  if(sprint) state.stamina = clamp(state.stamina - Math.round(10*weightFactor), 0, maxStamina());
  else state.stamina = clamp(state.stamina - 1, 0, maxStamina());
  state.hunger = clamp(state.hunger - 2, 0, 100);
  state.thirst = clamp(state.thirst - 2, 0, 100);

  let ambushChance = z.ambushBase - ambushReduction();
  if(sprint) ambushChance *= 0.5;
  ambushChance *= (eventEffect('ambushMult', state.extraction.zone) || 1);
  ambushChance = clamp(ambushChance, 0.02, 0.55);

  if(Math.random() < ambushChance){
    log(`Ambushed on the way to the beacon!`, 'bad');
    startCombat('extraction', makeMonsterFor(state.extraction.zone));
    return;
  }

  state.extraction.legsDone += 1;
  if(state.health <= 0){ collapseFromExposure(); return; }
  if(state.extraction.legsDone >= state.extraction.legsTotal){
    state.view = 'beacon';
    log('The extraction beacon is in sight.', 'good');
    render();
    return;
  }
  log(`Leg ${state.extraction.legsDone}/${state.extraction.legsTotal} clear.`, 'good');
  render();
}

/* ---------------- EXTRACTION BEACON (activation step) ---------------- */
function renderBeacon(panel){
  const haveStone = (state.carried.stone||0) >= 1;
  panel.innerHTML = `
    <h2 class="scene-title">Extraction Beacon</h2>
    <div class="beacon-box">
      <div class="bicon">◆</div>
      <div style="font-size:0.85rem;color:var(--text-dim);">The beacon needs a stone set into its base to open a safe path home. Any solid stone will do.</div>
    </div>
    <p class="scene-desc">Carried Stone: <b>${state.carried.stone||0}</b></p>
    <div class="btn-row">
      <button class="btn primary" id="activateBtn" ${haveStone?'':'disabled'}>Activate Beacon (uses 1 Stone)</button>
      <button class="btn moss" id="searchStoneBtn">Search Nearby for a Stone</button>
    </div>
  `;
  document.getElementById('activateBtn').onclick = activateBeacon;
  document.getElementById('searchStoneBtn').onclick = searchForStone;
}
function searchForStone(){
  state.hunger = clamp(state.hunger - 2, 0, 100);
  state.thirst = clamp(state.thirst - 2, 0, 100);
  state.stamina = clamp(state.stamina - 1, 0, maxStamina());
  const found = addToCarried('stone', randInt(1,2));
  if(found > 0) log(`Found ${found}× Stone near the beacon.`, 'good');
  const ambushChance = clamp(0.06 - ambushReduction(), 0.01, 0.06) * (eventEffect('ambushMult', state.zone) || 1);
  if(Math.random() < ambushChance){
    log('Something noticed you lingering at the beacon.', 'bad');
    startCombat('extraction', makeMonsterFor(state.extraction ? state.extraction.zone : state.zone));
    return;
  }
  render();
}
function activateBeacon(){
  if((state.carried.stone||0) < 1) return;
  state.carried.stone -= 1;
  log('Beacon activated. The path home opens.', 'good');
  completeExtraction();
}

function completeExtraction(){
  Object.entries(state.carried).forEach(([k,v])=>{ if(v>0) addToStorage(k,v); });
  const count = carriedTotal();
  state.carried = {};
  state.extraction = null;
  state.zone = null;
  state.view = 'home';
  log(`Reached extraction. Banked ${count} item${count!==1?'s':''} safely.`, 'good');
  render();
}

/* ---------------- COMBAT ---------------- */
function startCombat(context, monster){
  state.combat = { context, monster, cLog:[`${monster.name} blocks your path.`] };
  state.view = 'combat';
  render();
}

function renderCombat(panel){
  const c = state.combat; const m = c.monster;
  const playerHpPct = clamp((state.health/maxHealth())*100,0,100);
  const monHpPct = clamp((m.hp/m.maxHp)*100,0,100);
  const contextLabel = c.context === 'trial' ? 'System Trial' : (c.context === 'extraction' ? 'Ambushed En Route' : 'Encounter');
  panel.innerHTML = `
    <h2 class="scene-title">${contextLabel}${m.elite?' — Elite':''}</h2>
    <div class="combat-vs">
      <div class="combatant">
        <div class="combatant-name">You</div>
        <div class="bar-track"><div class="bar-fill health" style="width:${playerHpPct}%"></div></div>
        <div class="bar-label"><span>HP</span><span>${Math.round(state.health)}/${maxHealth()}</span></div>
      </div>
      <div class="combatant enemy">
        <div class="combatant-name">${m.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${monHpPct}%;background:linear-gradient(90deg,#7a2a2a,#c15b3a);"></div></div>
        <div class="bar-label"><span>HP</span><span>${Math.max(0,Math.round(m.hp))}/${m.maxHp}</span></div>
      </div>
    </div>
    <div class="combat-log" id="combatLog">${c.cLog.map(l=>`<div>${l}</div>`).join('')}</div>
    <div class="btn-row" style="padding-top:0;">
      <button class="btn primary" id="atkBtn">Attack${state.stamina < 15 ? ' (tired)':''}</button>
      <button class="btn" id="defBtn">Defend</button>
      <button class="btn danger" id="fleeBtn">Flee</button>
    </div>
  `;
  document.getElementById('atkBtn').onclick = () => combatTurn('attack');
  document.getElementById('defBtn').onclick = () => combatTurn('defend');
  document.getElementById('fleeBtn').onclick = () => combatTurn('flee');
  document.getElementById('combatLog').scrollTop = 0;
}

function cLogPush(msg){ state.combat.cLog.unshift(msg); if(state.combat.cLog.length>8) state.combat.cLog.pop(); }

function monsterHit(m){
  if(Math.random() < dodgeChance()){ cLogPush(`You dodge ${m.name}'s attack entirely.`); return 0; }
  let dmg = Math.round(m.atkMin + Math.random()*(m.atkMax-m.atkMin));
  dmg = Math.max(1, dmg - effArmorBonus());
  state.health = clamp(state.health - dmg, 0, maxHealth());
  cLogPush(`${m.name} hits you for ${dmg}.`);
  return dmg;
}

function combatTurn(action){
  const c = state.combat; const m = c.monster;

  if(action === 'flee'){
    state.stamina = clamp(state.stamina - 15, 0, maxStamina());
    const fleeChance = clamp(0.35 + dodgeChance()*0.6 + (state.attrs.AGI - m.speed*10)*0.015, 0.1, 0.85);
    if(Math.random() < fleeChance){
      cLogPush('You break away and escape.');
      log(`Escaped ${m.name}.`, 'good');
      const ctx = c.context;
      state.combat = null;
      state.view = ctx === 'trial' ? 'home' : (ctx === 'extraction' ? (state.extraction ? 'extraction' : 'beacon') : 'expedition');
      render();
      return;
    } else {
      cLogPush('Failed to escape — it gets a free hit.');
      monsterHit(m);
    }
  } else if(action === 'attack'){
    state.stamina = clamp(state.stamina - 8, 0, maxStamina());
    let dmg = Math.round(4 + state.attrs.STR*1.3 + effWeaponBonus() + Math.random()*6);
    if(state.stamina <= 0) dmg = Math.round(dmg*0.4);
    else if(state.stamina < 15) dmg = Math.round(dmg*0.65);
    m.hp -= dmg;
    cLogPush(`You strike ${m.name} for ${dmg}${state.stamina<15?' (exhausted)':''}.`);
    if(m.hp <= 0){ winCombat(); return; }
    monsterHit(m);
  } else if(action === 'defend'){
    state.stamina = clamp(state.stamina + 6 + state.attrs.AGI*0.4, 0, maxStamina());
    if(Math.random() < dodgeChance()*0.5){ cLogPush(`You brace and deflect ${m.name}'s attack entirely.`); }
    else {
      let dmg = Math.round((m.atkMin + Math.random()*(m.atkMax-m.atkMin)) * 0.5);
      dmg = Math.max(0, dmg - effArmorBonus());
      state.health = clamp(state.health - dmg, 0, maxHealth());
      cLogPush(`You brace yourself. ${m.name} hits you for ${dmg} (reduced).`);
    }
  }

  if(state.health <= 0){ loseCombat(); return; }
  render();
}

function grantWorldLoot(m){
  addXP(m.xp);
  const parts = [];
  const meatChance = 0.45 + (eventEffect('meatBonus', state.zone) || 0);
  const leatherChance = 0.22 + (eventEffect('leatherBonus', state.zone) || 0);
  if(Math.random() < meatChance){ addToCarried('meat_raw', 1); parts.push('1× Raw Meat'); }
  if(Math.random() < leatherChance){ addToCarried('leather', 1); parts.push('1× Leather'); }
  const scavengePool = ['wood','stone','water'];
  const item = scavengePool[Math.floor(Math.random()*scavengePool.length)];
  const amt = randInt(1,2);
  addToCarried(item, amt);
  parts.push(`${amt}× ${RESOURCE_META[item].label}`);
  if(m.elite){ addToCarried('metal', 1); parts.push('1× Metal (elite kill)'); }
  log(`Defeated ${m.name}. Looted ${parts.join(', ')}. +${m.xp} XP.`, 'good');
}

function winCombat(){
  const c = state.combat; const m = c.monster;
  if(c.context === 'trial'){
    const rarePool = ['metal','medicine','tools','herb'];
    const reward = rarePool[Math.floor(Math.random()*rarePool.length)];
    addToStorage(reward, 1);
    addXP(18 + state.level*2);
    state.nextTrialDay = state.day + 6 + Math.floor(Math.random()*5);
    state.combat = null; state.view = 'home'; render();
    showSystem({tag:'// SYSTEM — TRIAL RESOLVED', title:'Trial Complete',
      body:`You defeated the Trial monster.<br><br>Reward: <b>1× ${RESOURCE_META[reward].label}</b> (rare). Experience gained.`,
      actions:[{label:'Continue', onClick: render}]});
    log(`Trial won. Received 1× ${RESOURCE_META[reward].label}.`, 'rare');
  } else if(c.context === 'extraction'){
    grantWorldLoot(m);
    state.combat = null;
    if(state.extraction){
      state.extraction.legsDone += 1;
      if(state.extraction.legsDone >= state.extraction.legsTotal){ state.view = 'beacon'; render(); return; }
      state.view = 'extraction'; render();
    } else {
      state.view = 'beacon'; render();
    }
  } else {
    grantWorldLoot(m);
    state.combat = null; state.view = 'expedition'; render();
  }
}

function loseCombat(){
  const c = state.combat;
  if(c.context === 'trial'){
    state.combat = null; state.view = 'home';
    state.nextTrialDay = state.day + 6 + Math.floor(Math.random()*5);
    deathPenaltyTrial(c.monster.name);
  } else {
    state.combat = null; state.extraction = null; state.view = 'home';
    deathPenalty(c.monster.name);
  }
}

/* ---------------- DEATH PENALTIES ---------------- */
function deathPenaltyTrial(cause){
  const pct = deathLossPercent(state.level);
  let lost = [];
  Object.keys(state.storage).forEach(k=>{
    const amt = state.storage[k];
    if(amt > 0){
      const loss = Math.round(amt*pct);
      if(loss>0){ state.storage[k] -= loss; lost.push(`${loss} ${RESOURCE_META[k].label}`); }
    }
  });
  state.health = Math.round(maxHealth()*0.4); state.stamina = clamp(state.stamina,0,maxStamina()*0.5);
  render();
  showSystem({tag:'// SYSTEM — TRIAL LOST', title:'The Trial Overwhelmed You',
    body:`Defeated by ${cause} on your own ground.<br><br>You lose <b>${Math.round(pct*100)}%</b> of your home storage (Level ${state.level} penalty).<br>${lost.length?'Lost: '+lost.join(', '):'You had nothing to lose.'}`,
    danger:true, actions:[{label:'Continue', onClick: render}]});
  log(`Trial lost against ${cause}. ${Math.round(pct*100)}% of storage lost.`, 'bad');
}

function deathPenalty(cause){
  let lost = [];
  Object.keys(state.carried).forEach(k=>{
    const amt = state.carried[k];
    if(amt>0) lost.push(`${amt} ${RESOURCE_META[k].label}`);
  });
  state.carried = {};
  state.health = Math.round(maxHealth()*0.3); state.stamina = clamp(state.stamina,0,maxStamina()*0.4);
  state.zone = null;
  render();
  showSystem({tag:'// SYSTEM — DEATH PENALTY', title:'You Went Down',
    body:`Cause: <b>${cause}</b>.<br><br>Everything you were carrying is gone. You wake back on your plot with nothing to show for the trip.<br>${lost.length?'Lost: '+lost.join(', '):'You had nothing carried to lose.'}`,
    danger:true, actions:[{label:'Return Home', onClick: render}]});
  log(`Went down to ${cause}. Lost everything carried.`, 'bad');
}

/* init */
initGame();
</script>
